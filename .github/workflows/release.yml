# 发版：推送到 main 以后，如果「电脑端版本 + 手机端版本」这一对还没发布过，就在 GitHub 的机器上
# 编译两端、打包，发一个 Release；版本号没变就什么都不做。所以发新版 = 改版本号 + 推送。
# 手机端每一版有两个：完整安装包（带语音模型，第一次装用）和不带模型的更新包（-update.apk，App 里更新用）。
# Release 里还有一个 latest.json（两端的版本号、下载地址、大小、SHA-256、更新说明）和它的签名 latest.json.sig：
# 两端的蒜鸟读 releases/latest/download/latest.json 看有没有新版本（pc/update、android Updater.kt）。
# 发完再同步一份到 Gitee（国内快，两端先找那边；见 .github/gitee-sync.py）。
# 也可以在仓库网页的 Actions → 发版 → Run workflow 手动跑一遍（同样只在版本号是新的时候发）。
name: 发版

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同时推了好几次就排队，一个一个来
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: 看版本号是不是新的
    runs-on: ubuntu-latest
    outputs:
      pc: ${{ steps.v.outputs.pc }}
      phone: ${{ steps.v.outputs.phone }}
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pc=$(sed -n 's/^version = "\(.*\)".*/\1/p' pc/ui/Cargo.toml | head -1)
          core=$(sed -n 's/^version = "\(.*\)".*/\1/p' pc/core/Cargo.toml | head -1)
          phone=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          if [ -z "$pc" ] || [ -z "$phone" ]; then echo "::error::读不到版本号"; exit 1; fi
          if [ "$pc" != "$core" ]; then echo "::error::pc/ui 是 $pc、pc/core 是 $core，两个要一起改"; exit 1; fi
          tag="pc$pc-android$phone"
          if gh release view "$tag" >/dev/null 2>&1; then new=false; else new=true; fi
          # 每个新版本都要在 CHANGELOG.md 里写这一版改了什么，没写就不发
          if [ "$new" = true ] && ! grep -qxF "## 电脑端 $pc · 手机端 $phone" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有「## 电脑端 $pc · 手机端 $phone」这一段，先写好这一版改了什么再发"; exit 1
          fi
          echo "电脑端 $pc，手机端 $phone，发布名 $tag，要发新版：$new"
          { echo "pc=$pc"; echo "phone=$phone"; echo "tag=$tag"; echo "new=$new"; } >> "$GITHUB_OUTPUT"

  pc:
    name: 编译电脑端
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    env:
      # C 运行库静态链进 exe：别人电脑上没装 VC++ 运行库也能打开
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      # 文件原样取出来（仓库里都是 LF），和本机编译用的一模一样
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update; rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc
      - name: 编译
        working-directory: pc
        run: cargo build --release --locked
      # 安装包：启动程序 SuanNIAO-Setup.exe 后面接上压缩好的两个 exe（pc/setup）。
      # 双击后运行里面的 `SuanNIAO.exe --setup`，安装界面和蒜鸟一个样子（pc/ui/src/setup.rs）
      - name: 做安装包
        working-directory: pc
        env:
          VER: ${{ needs.check.outputs.pc }}
        run: |
          target/release/suanniao-pack.exe target/release/SuanNIAO-Setup.exe "target/installer/SuanNIAO-PC-$env:VER-Setup.exe" target/release/SuanNIAO.exe target/release/SuanNIAO-core.exe
          if ($LASTEXITCODE -ne 0) { throw '安装包没做出来' }
      - uses: actions/upload-artifact@v7
        with:
          name: pc
          path: pc/target/installer/SuanNIAO-PC-*-Setup.exe
          if-no-files-found: error

  android:
    name: 编译手机端
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # 签名密钥存在仓库的加密变量里（Settings → Secrets and variables → Actions），原件在发版人电脑上
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SUANNIAO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::仓库的加密变量里没有 SUANNIAO_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SUANNIAO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # 「快」那档语音模型（x-asr-480ms）打进安装包（见 android/app/build.gradle.kts）。
      # 模型太大进不了仓库，从 sherpa-onnx 的发布页下载，核对指纹，只取要用的四个文件
      - name: 下载语音模型
        run: |
          name=sherpa-onnx-x-asr-480ms-streaming-zipformer-transducer-zh-en-punct-int8-2026-06-05
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/model.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$name.tar.bz2"
          echo "fa5f63d618e5a01526e275a358bb7772e403f84808a4769fba52cffd8160bf74  $RUNNER_TEMP/model.tar.bz2" | sha256sum -c -
          mkdir -p models/x-asr-480ms
          tar xjf "$RUNNER_TEMP/model.tar.bz2" --strip-components=1 -C models/x-asr-480ms \
            "$name/encoder.int8.onnx" "$name/decoder.onnx" "$name/joiner.int8.onnx" "$name/tokens.txt"
          ls -l models/x-asr-480ms
      - name: 编译
        working-directory: android
        env:
          SUANNIAO_KEYSTORE_PASSWORD: ${{ secrets.SUANNIAO_KEYSTORE_PASSWORD }}
          SUANNIAO_KEY_ALIAS: suanniao
        run: ./gradlew assembleRelease --no-daemon
      - name: 改名
        env:
          VER: ${{ needs.check.outputs.phone }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::没生成签过名的 app-release.apk"; ls -R android/app/build/outputs/apk; exit 1; fi
          if [ "$(unzip -l "$apk" | grep -c 'assets/models/x-asr-480ms/')" != 4 ]; then echo "::error::安装包里没带齐语音模型"; unzip -l "$apk" | grep assets/; exit 1; fi
          cp "$apk" "SuanNIAO-Android-$VER.apk"
      # 同一版再打一个不带语音模型的「更新包」（三十 MB 左右）：已经装着蒜鸟的手机在 App 里更新时只下它，
      # 装之前蒜鸟把模型从现在的安装包里拷到手机存储（见 android/app/build.gradle.kts 的 noModel、Updater.kt）
      - name: 编译更新包（不带语音模型）
        working-directory: android
        env:
          SUANNIAO_KEYSTORE_PASSWORD: ${{ secrets.SUANNIAO_KEYSTORE_PASSWORD }}
          SUANNIAO_KEY_ALIAS: suanniao
        # 先删掉上一步打的完整安装包：打包是增量的，留着它的话，删掉的模型会在新文件里留成一百多 MB 的空洞
        run: |
          rm -f app/build/outputs/apk/release/app-release.apk
          ./gradlew assembleRelease -PnoModel --no-daemon
      - name: 改名（更新包）
        env:
          VER: ${{ needs.check.outputs.phone }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ "$(unzip -l "$apk" | grep -c 'assets/models/')" != 0 ]; then echo "::error::更新包里不该有语音模型"; unzip -l "$apk" | grep assets/; exit 1; fi
          if [ "$(stat -c %s "$apk")" -gt $((80 * 1024 * 1024)) ]; then echo "::error::更新包超过 80 MB，不对劲（Gitee 附件最多 100 MB）"; ls -l "$apk"; exit 1; fi
          cp "$apk" "SuanNIAO-Android-$VER-update.apk"
          ls -l SuanNIAO-Android-*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: SuanNIAO-Android-*.apk
          if-no-files-found: error

  publish:
    name: 发布
    needs: [check, pc, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PC: ${{ needs.check.outputs.pc }}
          PHONE: ${{ needs.check.outputs.phone }}
          TAG: ${{ needs.check.outputs.tag }}
          GITEE_REPO: drhhhao_0/SuanNIAO
          UPDATE_KEY: ${{ secrets.SUANNIAO_UPDATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then echo "::error::仓库的加密变量里没有 SUANNIAO_UPDATE_KEY（更新签名私钥）"; exit 1; fi
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          # CHANGELOG.md 里从这一版往下、到上一次发布的那一版为止的几段：中间没发布过的版本（比如本机部署过的）一起算进来。
          # 每段的标题改成「#### 电脑端 X · 手机端 Y」；只有一段时不要标题
          stop=""
          if [ -n "$prev" ]; then v=${prev#pc}; stop="## 电脑端 ${v%%-android*} · 手机端 ${v#*-android}"; fi
          awk -v h="## 电脑端 $PC · 手机端 $PHONE" -v stop="$stop" '
            $0 == h { on = 1; print "#### " substr($0, 4); next }
            on && /^## / { if (stop == "" || $0 == stop) exit; print "#### " substr($0, 4); next }
            on' CHANGELOG.md > changes.md
          if [ "$(grep -c '^#### ' changes.md)" = 1 ]; then sed -i '1d' changes.md; fi
          if ! grep -q '[^[:space:]]' changes.md; then echo "::error::CHANGELOG.md 里这一版的更新说明是空的"; exit 1; fi
          # 两端检查更新读的 latest.json。更新说明取这几段里顶格的「- 」：写在「电脑端…」「手机端…」下面的只算那一端，
          # 「两端一起…」下面的和没写哪一端的两端都算（每段重新算）
          python3 - <<'PY'
          import datetime, hashlib, json, os, re
          pc, phone, tag, repo, gitee = (os.environ[k] for k in ("PC", "PHONE", "TAG", "GH_REPO", "GITEE_REPO"))
          gradle = open("android/app/build.gradle.kts", encoding="utf-8").read()
          code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1))
          notes = {"all": [], "pc": [], "android": []}
          sides = ("pc", "android")
          for line in open("changes.md", encoding="utf-8"):
              line = line.rstrip()
              if line.startswith("#"):
                  sides = ("pc", "android")
              elif line.startswith("电脑端"):
                  sides = ("pc",)
              elif line.startswith("手机端"):
                  sides = ("android",)
              elif line.startswith("两端"):
                  sides = ("pc", "android")
              elif line.startswith("- "):
                  text = line[2:].replace("`", "").strip()
                  notes["all"].append(text)
                  for side in sides:
                      notes[side].append(text)
          import zipfile
          def asset(name, version, **extra):
              data = open(f"dist/{name}", "rb").read()
              url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
              return dict(version=version, file=name, url=url, size=len(data), sha256=hashlib.sha256(data).hexdigest(), **extra)
          manifest = dict(
              schema=1, tag=tag, title=f"蒜鸟 电脑端 {pc} · 手机端 {phone}",
              published=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              page=f"https://github.com/{repo}/releases/tag/{tag}", notes=notes["all"],
              pc=asset(f"SuanNIAO-PC-{pc}-Setup.exe", pc, notes=notes["pc"]),
              android=asset(f"SuanNIAO-Android-{phone}.apk", phone, code=code, notes=notes["android"]),
              # Gitee 上同一版的下载地址（同名文件；手机安装包超过 Gitee 附件的 100 MB 上限，拆成 90 MB 一份的 parts）
              mirror=f"https://gitee.com/{gitee}/releases/download/{tag}/",
          )
          # 不带模型的更新包：要手机上先有的模型（名字 = 完整安装包里 assets/models/ 下的目录名，大小 = 几个文件加起来）。
          # 换了模型、目录名跟着换，手机上没有这个名字的模型就会自己改下完整安装包
          with zipfile.ZipFile(f"dist/SuanNIAO-Android-{phone}.apk") as z:
              model_files = [i for i in z.infolist() if i.filename.startswith("assets/models/") and not i.is_dir()]
          model_names = {i.filename.split("/")[2] for i in model_files}
          if len(model_names) != 1:
              raise SystemExit(f"完整安装包里的语音模型不是正好一个：{model_names}")
          model = dict(name=model_names.pop(), size=sum(i.file_size for i in model_files))
          lite = asset(f"SuanNIAO-Android-{phone}-update.apk", phone, model=model)
          del lite["version"]
          manifest["android"]["lite"] = lite
          chunk = 90 * 1024 * 1024
          size, name = manifest["android"]["size"], manifest["android"]["file"]
          manifest["android"]["parts"] = [dict(file=f"{name}.{i + 1}", size=min(chunk, size - start))
                                          for i, start in enumerate(range(0, size, chunk))]
          with open("dist/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          cat dist/latest.json
          # 签名：电脑端内置公钥，只认签名对得上的 latest.json（不管从 GitHub 还是 Gitee 读的）
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/update.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update.pem" -rawin -in dist/latest.json -out dist/latest.json.sig
          rm "$RUNNER_TEMP/update.pem"
          if [ "$(wc -c < dist/latest.json.sig)" != 64 ]; then echo "::error::latest.json 没签上名"; exit 1; fi
          # 文件名只能用英文（GitHub 会把中文文件名改掉，两端检查更新也认这几个名字），
          # 所以开头放两个写明「电脑版」「手机版」的下载链接，文件列表里也给每个文件加中文显示名（下面的 #标签）
          pc_file="SuanNIAO-PC-$PC-Setup.exe"
          phone_file="SuanNIAO-Android-$PHONE.apk"
          lite_file="SuanNIAO-Android-$PHONE-update.apk"
          full_mb=$(( ($(stat -c %s "dist/$phone_file") + 524288) / 1048576 ))
          lite_mb=$(( ($(stat -c %s "dist/$lite_file") + 524288) / 1048576 ))
          dl="https://github.com/$GH_REPO/releases/download/$TAG"
          {
            echo "## 下载"
            echo
            echo "- **电脑**（Windows 10 / 11）：[点这里下载电脑版安装包]($dl/$pc_file)（\`$pc_file\`）"
            echo "- **手机**（安卓）：[点这里下载手机版安装包]($dl/$phone_file)（\`$phone_file\`，约 $full_mb MB）"
            echo
            echo "电脑和手机都要装。最下面的「Source code」是源代码，不用下。"
            echo
            echo "**电脑版**：双击安装，不用管理员权限，装好后开始菜单里有「蒜鸟」。"
            echo "Windows 提示「Windows 已保护你的电脑」时，点「更多信息」→「仍要运行」。装好以后有新版本时蒜鸟会自己提示，点「立即更新」就行，设置都会留着。"
            echo
            echo "**手机版**：在手机上打开安装（只支持 64 位的安卓手机）。语音识别的模型已经在安装包里，装好就能用。"
            echo
            echo "**手机该下哪个**"
            echo
            echo "- **第一次装**（或者卸载过、要重装）：下上面的手机版安装包 \`$phone_file\`（完整版，约 $full_mb MB，带语音模型）。"
            echo "- **已经装着蒜鸟**：不用来这里下。手机上的蒜鸟会提示有新版本，点「立即更新」，自动只下约 $lite_mb MB 的更新包，语音模型留在手机上，不用再下。"
            echo "- 文件列表里的 \`$lite_file\` 就是这个更新包，给 App 里自动更新用：**不带语音模型，第一次装别下它**（装上以后本地语音识别用不了）。"
            echo "- 换了语音模型的版本，更新说明里会写明；那一次蒜鸟会自动下完整安装包，不用另外操作。"
            echo
            if [ -n "$prev" ]; then echo "### 和上一版（$prev）比改了什么"; else echo "### 这一版有什么"; fi
            cat changes.md
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "蒜鸟 电脑端 $PC · 手机端 $PHONE" --notes-file notes.md \
            "dist/$pc_file#电脑版安装包（Windows 10 / 11）· $pc_file" \
            "dist/$phone_file#手机版安装包（安卓，完整版，第一次装下这个）· $phone_file" \
            "dist/$lite_file#手机版更新包（App 里自动更新用，不带语音模型，第一次装别下）· $lite_file" \
            "dist/latest.json#latest.json（自动更新用，不用下载）" \
            "dist/latest.json.sig#latest.json.sig（自动更新用，不用下载）"

  gitee:
    name: 同步到 Gitee
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 刚发布的这一版原样下回来，传到 Gitee（见 .github/gitee-sync.py）。没传成两端照样从 GitHub 更新
      - name: 同步
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          GITEE_REPO: drhhhao_0/SuanNIAO
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          gh release download "$TAG" --dir dist
          python3 .github/gitee-sync.py
