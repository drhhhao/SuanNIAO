# 发版：推送到 main 以后，如果「电脑端版本 + 手机端版本」这一对还没发布过，就在 GitHub 的机器上
# 编译两端、打包，发一个 Release；版本号没变就什么都不做。所以发新版 = 改版本号 + 推送。
# 也可以在仓库网页的 Actions → 发版 → Run workflow 手动跑一遍（同样只在版本号是新的时候发）。
name: 发版

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同时推了好几次就排队，一个一个来
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: 看版本号是不是新的
    runs-on: ubuntu-latest
    outputs:
      pc: ${{ steps.v.outputs.pc }}
      phone: ${{ steps.v.outputs.phone }}
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pc=$(sed -n 's/^version = "\(.*\)".*/\1/p' pc/ui/Cargo.toml | head -1)
          core=$(sed -n 's/^version = "\(.*\)".*/\1/p' pc/core/Cargo.toml | head -1)
          phone=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          if [ -z "$pc" ] || [ -z "$phone" ]; then echo "::error::读不到版本号"; exit 1; fi
          if [ "$pc" != "$core" ]; then echo "::error::pc/ui 是 $pc、pc/core 是 $core，两个要一起改"; exit 1; fi
          tag="pc$pc-android$phone"
          if gh release view "$tag" >/dev/null 2>&1; then new=false; else new=true; fi
          echo "电脑端 $pc，手机端 $phone，发布名 $tag，要发新版：$new"
          { echo "pc=$pc"; echo "phone=$phone"; echo "tag=$tag"; echo "new=$new"; } >> "$GITHUB_OUTPUT"

  pc:
    name: 编译电脑端
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    env:
      # C 运行库静态链进 exe：别人电脑上没装 VC++ 运行库也能打开
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      # 文件原样取出来（仓库里都是 LF），和本机编译用的一模一样
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update; rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc
      - name: 编译
        working-directory: pc
        run: cargo build --release --locked
      - name: 打包
        env:
          VER: ${{ needs.check.outputs.pc }}
        run: |
          $dir = "SuanNIAO-PC-$env:VER"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item pc/target/release/SuanNIAO.exe, pc/target/release/SuanNIAO-core.exe $dir
          # 说明文件换成 CRLF + BOM，老记事本打开也不乱码
          $readme = (Get-Content -Raw -Encoding utf8 pc/dist/README.txt).Replace('{version}', $env:VER) -replace "`r?`n", "`r`n"
          Set-Content -NoNewline -Encoding utf8BOM "$dir/README.txt" $readme
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: pc
          path: SuanNIAO-PC-*.zip
          if-no-files-found: error

  android:
    name: 编译手机端
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # 签名密钥存在仓库的加密变量里（Settings → Secrets and variables → Actions），原件在发版人电脑上
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SUANNIAO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::仓库的加密变量里没有 SUANNIAO_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SUANNIAO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: 编译
        working-directory: android
        env:
          SUANNIAO_KEYSTORE_PASSWORD: ${{ secrets.SUANNIAO_KEYSTORE_PASSWORD }}
          SUANNIAO_KEY_ALIAS: suanniao
        run: ./gradlew assembleRelease --no-daemon
      - name: 改名
        env:
          VER: ${{ needs.check.outputs.phone }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::没生成签过名的 app-release.apk"; ls -R android/app/build/outputs/apk; exit 1; fi
          cp "$apk" "SuanNIAO-Android-$VER.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: SuanNIAO-Android-*.apk
          if-no-files-found: error

  publish:
    name: 发布
    needs: [check, pc, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 要拿到上一个发布以来的提交记录
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PC: ${{ needs.check.outputs.pc }}
          PHONE: ${{ needs.check.outputs.phone }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          {
            echo "**电脑**：下载 \`SuanNIAO-PC-$PC.zip\`，解压到一个固定的文件夹，双击 \`SuanNIAO.exe\`。"
            echo
            echo "**手机**：下载 \`SuanNIAO-Android-$PHONE.apk\` 安装（只支持 64 位的安卓手机）。"
            if [ -n "$prev" ]; then
              echo
              echo "### 和 $prev 比改了什么"
              git log --no-merges --format='- %s' "$prev..HEAD"
            fi
          } > notes.md
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "蒜鸟 电脑端 $PC · 手机端 $PHONE" --notes-file notes.md
