[package]
name = "suanniao-ui"
version = "0.7.5"
edition = "2021"
description = "蒜鸟电脑端主界面：编辑手机布局、按键映射和设置"
build = "build.rs"

[[bin]]
name = "SuanNIAO"
path = "src/main.rs"

[dependencies]
suanniao-config = { path = "../config" }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
raw-window-handle = "0.6"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"
