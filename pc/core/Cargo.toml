[package]
name = "suanniao-core"
version = "0.7.13"
edition = "2021"
description = "蒜鸟电脑端后台：托盘常驻、蓝牙串口服务、执行按键映射"

[[bin]]
name = "SuanNIAO-core"
path = "src/main.rs"

[dependencies]
suanniao-config = { path = "../config" }
suanniao-update = { path = "../update" }
# 局域网连接的加密和认证（TLS、扫码配对）
suanniao-lan = { path = "../lan" }
serde_json = "1"
# 电脑上复制的图片同步给手机（clipimage.rs）：读剪贴板里的位图，编成 PNG / JPEG。界面的 slint 本来就带着它
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
base64 = "0.22"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth_Rfcomm",
    "Networking_Sockets",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
